name: Pre-release

on:
  push:
    branches:
      - pre-release
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve beta version
        id: version
        run: |
          python -m pip install pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          with open("cctv_viewer_beta/config.yaml", encoding="utf-8") as handle:
              print(f"value={yaml.safe_load(handle)['version']}")
          PY
      - name: Build and publish beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cctv-viewer-beta:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/cctv-viewer-beta:latest
      - name: Expose published beta to Home Assistant
        env:
          BETA_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p /tmp/cctv-beta-metadata
          cp cctv_viewer_beta/config.yaml \
             cctv_viewer_beta/CHANGELOG.md \
             cctv_viewer_beta/DOCS.md \
             /tmp/cctv-beta-metadata/

          git fetch origin main
          git checkout --detach origin/main
          cp /tmp/cctv-beta-metadata/config.yaml cctv_viewer_beta/config.yaml
          cp /tmp/cctv-beta-metadata/CHANGELOG.md cctv_viewer_beta/CHANGELOG.md
          cp /tmp/cctv-beta-metadata/DOCS.md cctv_viewer_beta/DOCS.md

          if git diff --quiet -- cctv_viewer_beta; then
            echo "Beta ${BETA_VERSION} is already exposed on main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cctv_viewer_beta/config.yaml \
                  cctv_viewer_beta/CHANGELOG.md \
                  cctv_viewer_beta/DOCS.md
          git commit -m "Expose CCTV Viewer Beta ${BETA_VERSION}"
          git push origin HEAD:main
